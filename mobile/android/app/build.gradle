plugins { id 'com.android.application' }
def site = providers.gradleProperty('arenaUrl').getOrElse('https://defense-simulator.onrender.com')
def uri = new URI(site)
if (uri.scheme != 'https' || !uri.host || uri.rawUserInfo || uri.rawQuery || uri.rawFragment || !(uri.path in ['', '/'])) {
    throw new GradleException('arenaUrl must be a single HTTPS website origin')
}
android {
    namespace 'com.defensearena.mobile'
    compileSdk 36
    defaultConfig {
        applicationId 'com.defensearena.mobile'
        minSdk 30
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
        buildConfigField 'String', 'ARENA_URL', '"' + site.replaceAll('/+$', '') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
